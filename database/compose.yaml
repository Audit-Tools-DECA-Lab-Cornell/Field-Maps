name: fieldmaps-local

services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    platform: linux/amd64
    network_mode: none
    entrypoint: ["/bin/sh", "/workspace/local-bootstrap.sh"]
    volumes:
      - fieldmaps_data:/var/lib/postgresql
      - fieldmaps_socket:/var/run/postgresql
      - .:/workspace:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fieldmaps_owner", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  api:
    profiles: ["api"]
    build: ../backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fieldmaps_socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy

volumes:
  fieldmaps_data:
  fieldmaps_socket:
